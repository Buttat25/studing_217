# Самопроверка решений при каждом push и Pull Request: те же открытые тесты, что python tools/check.py.
# Сборка не «краснеет» из-за недоделанных задач - результат смотрите в сводке запуска (Summary).
name: Самопроверка

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt

      - name: Открытые тесты всех задач
        run: |
          python tools/check.py all > check.txt 2>&1 || true
          cat check.txt
          {
            echo "## Самопроверка"
            echo '```'
            cat check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
